[project]
name = "blazer-drive-translation"
version = "0.3.0"
description = "English fan-translation toolkit for Blazer Drive (Nintendo DS): exact .bmsg extraction, validated injection, texture text redraw, VWF font and real-emulator QA"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "ndspy>=4.2.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "rich>=15.0.0",
]

[tool.uv]
package = false
